<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name=
    "viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ansu Kumar Hotels - Premium Indian Hospitality & Luxury Resort</title>
    <meta name="description" content="Experience refined Indian hospitality, 3 luxury room categories, authentic fine dining, and world-class resort amenities in Coimbatore at Ansu Kumar Hotels." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Anti-flicker Dark Theme Initializer -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('site_theme');
          if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
